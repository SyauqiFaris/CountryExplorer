<div class="flex flex-col gap-4 sm:flex-row sm:items-end">
  <div class="flex-1">
    <label
      for="search-input"
      class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
    >
      Cari negara
    </label>
    <input
      id="search-input"
      type="text"
      placeholder="Cari nama negara..."
      (input)="onSearchInput($any($event.target).value)"
      class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2 text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500"
    />
  </div>

  <div class="sm:w-56">
    <label
      for="region-select"
      class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
    >
      Region
    </label>
    <select
      id="region-select"
      (change)="onRegionChange($any($event.target).value)"
      class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2 text-slate-900 focus:border-slate-500 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
    >
      <option value="">Semua Region</option>
      @for (region of regions; track region) {
        <option [value]="region">{{ region }}</option>
      }
    </select>
  </div>
</div>
