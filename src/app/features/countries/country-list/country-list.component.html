<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
  <h1 class="mb-6 text-2xl font-bold text-slate-900 dark:text-slate-100">Country Explorer</h1>

  <app-search-bar
    (searchChange)="searchTerm.set($event)"
    (regionChange)="region.set($event)"
    class="mb-6 block"
  />

  @if (state(); as s) {
    @switch (s.status) {
      @case ('loading') {
        <div class="flex items-center justify-center gap-3 py-24 text-slate-500 dark:text-slate-400">
          <span
            class="h-6 w-6 animate-spin rounded-full border-2 border-slate-300 border-t-slate-600 dark:border-slate-600 dark:border-t-slate-300"
          ></span>
          <span>Memuat data negara...</span>
        </div>
      }
      @case ('error') {
        <div
          class="rounded-lg bg-red-50 px-4 py-8 text-center text-red-700 dark:bg-red-950 dark:text-red-300"
        >
          {{ s.message }}
        </div>
      }
      @case ('success') {
        @if (s.data.length === 0) {
          <div class="py-24 text-center text-slate-500 dark:text-slate-400">
            Negara tidak ditemukan.
          </div>
        } @else {
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
            @for (country of s.data; track country.cca3) {
              <app-country-card [country]="country" />
            }
          </div>
        }
      }
    }
  }
</main>
